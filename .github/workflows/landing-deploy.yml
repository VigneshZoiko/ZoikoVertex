name: Vercel Landing Deployment
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_LANDING_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
on:
  push:
    branches:
      - main
    paths:
      - 'landing/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Dependencies
        run: npm install
        working-directory: ./landing

      - name: Verify Local Build
        run: npm run build
        working-directory: ./landing

      - name: Check Vercel token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret is not set. Add it in repo Settings → Secrets and variables → Actions (fork PRs do not have access to secrets)."
            exit 1
          fi

      - name: Deploy to Vercel
        run: npx vercel deploy --prod --token "$VERCEL_TOKEN" --cwd ./landing --yes --archive=tgz
