services:
  - type: web
    name: zoikovertex-custos-api
    runtime: node
    region: oregon
    plan: starter
    rootDir: custos-BE
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        value: https://app.getzoikovertex.com
      # Supabase
      - key: SUPABASE_URL
        value: https://wcudapbmavuyafllfyft.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Auth
      - key: JWT_SECRET
        sync: false
      # Mail — SendGrid API (recommended for Render; SMTP is blocked)
      - key: SENDGRID_API_KEY
        sync: false
      - key: FROM_EMAIL
        value: info@zoikovertex.com
      # SMTP fallback (local dev only — not used in production)
      - key: SMTP_HOST
        value: smtpout.secureserver.net
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        value: info@zoikovertex.com
      - key: SMTP_PASS
        sync: false
      # AI
      - key: AI_PROVIDER
        value: groq
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: llama-3.3-70b-versatile

  - type: web
    name: zoikovertex-api
    runtime: node
    region: oregon
    plan: starter
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        value: https://getzoikovertex.com
      # Supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # AI — Google Gemini + Groq
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Phase 6 — Optional real model validation (Prompt Governance).
      # Default 'false': server boots normally; real adversarial + cross-model
      # evaluation return a clear "skipped" status; Phase 1–5 governance
      # is unaffected.
      # When 'true': at least one of GEMINI_API_KEY or GROQ_API_KEY must be
      # set, or the server refuses to start. See backend/src/modules/prompts/modelProviders.ts.
      - key: ENABLE_REAL_MODEL_VALIDATION
        value: false
      # Meta (Facebook + Instagram + Threads)
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_REDIRECT_URI
        value: https://api.getzoikovertex.com/api/auth/facebook/callback
      # LinkedIn
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_REDIRECT_URI
        value: https://api.getzoikovertex.com/api/auth/linkedin/callback
      # Pinterest
      - key: PINTEREST_CLIENT_ID
        sync: false
      - key: PINTEREST_CLIENT_SECRET
        sync: false
      - key: PINTEREST_REDIRECT_URI
        value: https://api.getzoikovertex.com/api/auth/pinterest/callback
      - key: PINTEREST_API_BASE
        value: https://api.pinterest.com
      # Threads
      - key: THREADS_APP_ID
        sync: false
      - key: THREADS_APP_SECRET
        sync: false
      - key: THREADS_REDIRECT_URI
        value: https://api.getzoikovertex.com/api/auth/threads/callback
      # Twitter / X
      - key: TWITTER_CLIENT_ID
        sync: false
      - key: TWITTER_CLIENT_SECRET
        sync: false
      - key: TWITTER_REDIRECT_URI
        value: https://api.getzoikovertex.com/api/auth/twitter/callback
      # YouTube
      - key: YOUTUBE_CLIENT_ID
        sync: false
      - key: YOUTUBE_CLIENT_SECRET
        sync: false
      - key: YOUTUBE_REDIRECT_URI
        value: https://api.getzoikovertex.com/api/auth/youtube/callback
      # Redis
      - key: REDIS_URL
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      # Internal
      - key: INTERNAL_SERVICE_SECRET
        sync: false
